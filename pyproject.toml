[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptp-credibility"
version = "1.0.0"
description = "Real-time promise-to-pay credibility scoring, typing and disposition for debt collections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3,<1.6",
  "xgboost>=2.0",
  "joblib>=1.3",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "jinja2>=3.1",
  "fastapi>=0.100",
  "uvicorn>=0.23",
  "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
